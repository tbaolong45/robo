# Study preferences. These are the constraints the deterministic packer obeys.
# The LLM never sees or overrides these - it only scores priority and duration.

[horizon]
# How many days ahead to plan.
days = 7

[study]
session_min_minutes = 45
session_max_minutes = 120
# Minimum gap between two study blocks.
break_minutes = 15
# Ceiling on total study time per day, across all courses.
daily_cap_minutes = 300
# Ceiling per course per day, so one subject cannot eat the whole evening.
course_daily_cap_minutes = 180
# Never schedule outside these local hours.
earliest_hour = 8
latest_hour = 22
# 0 = Monday ... 6 = Sunday.
weekdays_allowed = [0, 1, 2, 3, 4, 5, 6]
# A tighter cap on Sat/Sun if you want lighter weekends.
weekend_daily_cap_minutes = 240

[deep_work]
# Blocks needing deep concentration are placed before this hour when possible.
prefer_before_hour = 14

[deadlines]
# Anything due within this many days is treated as top priority.
urgent_within_days = 3

[weights]
# Per-course priority multipliers. Higher = scheduled first.
# Example:
#   "CS301" = 1.5
#   "GEN101" = 0.8
