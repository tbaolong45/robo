# =============================================================================
# BEST-EFFORT SELECTORS. THESE ARE THE FIRST THING TO FIX WHEN A PAGE CHANGES.
#
# Microsoft restyles Outlook and Teams on its own schedule and documents none of
# it. Every value below was correct on the day it was written and none of it is
# supported API, so treat this file as a guess that is expected to go stale.
#
# When a read starts coming back empty, check this file before anything else.
# The diagnostics dump a failed read leaves in data/diagnostics/ writes the page
# HTML, a full-page screenshot, the visible text and the address the browser was
# on, so the new attribute can be read straight off the real markup instead of
# guessed at. There is nothing to run to get one: the dump is written by the
# failure itself.
#
# Every value is a *Playwright* selector, not plain CSS - which is what lets the
# accessible-name form `role=button[name="New event"]` live in a string. Prefer
# that form: a button has to keep announcing itself to a screen reader through a
# restyle, whereas data-tid / data-automationid are internal handles Microsoft
# renames freely. The id forms below are the fallback half of each pair.
#
# Prefer the inner container when a pair would also match an outer one; anything
# still caught twice is deduplicated, keeping the innermost.
#
# A key missing here falls back to the built-in default in
# src/pli/browser/selectors.py. A key not listed there is ignored. Putting these
# under [outlook] / [teams] or flat at the top level both work.
# =============================================================================

[outlook]
# The week board. Reads are scoped to it, so an event on another calendar view
# cannot be mistaken for one in the week being planned.
outlook_week_grid = "[data-automationid='CalendarGrid'], [role='grid']"
# A single event chip on the week board.
outlook_event = "[data-automationid='CalendarItem'], [role='button'][aria-label*='Calendar item']"
# Subject line inside an opened event.
outlook_event_subject = "[data-automationid='subject'], [role='textbox'][aria-label*='title' i]"
# Start/end line inside an opened event.
outlook_event_time = "[data-automationid='time'], [data-automationid='timePrefix']"
outlook_new_event_button = "role=button[name='New event']"
outlook_title_field = "role=textbox[name='Add a title']"
outlook_start_field = "role=textbox[name='Start time']"
outlook_end_field = "role=textbox[name='End time']"
# Checked before every write: study blocks must only ever be saved here.
outlook_calendar_picker = "role=combobox[name='Calendar']"
outlook_save_button = "role=button[name='Save']"
outlook_delete_button = "role=button[name='Delete']"
# One row of the inbox list. Read-only: the mail reader never clicks it, because
# selecting a message makes Outlook mark it read. Its text is the row's aria-label.
outlook_mail_row = "[role='option'][data-convid]"

[teams]
teams_app_bar = "[data-tid='app-bar'], [data-tid='titlebar']"
teams_channel_list = "[data-tid='channel-list'], [data-tid='channel-list-pane']"
# One channel in a team's sidebar.
teams_channel_item = "[data-tid='channel-list-item'], [role='treeitem']"
teams_message_list = "[data-tid='message-list'], [role='list'][aria-label*='message' i]"
teams_message = "[data-tid='chat-pane-message'], [data-tid='message-body']"
teams_message_author = "[data-tid='message-author-name'], [data-tid='message-author']"
teams_message_time = "[data-tid='message-timestamp'], [data-tid='message-time']"
teams_message_body = "[data-tid='message-body-content'], [data-tid='message-body']"
# Whatever Teams calls "scroll up for older posts" this week.
teams_more_messages = "button[aria-label*='Load more' i], [data-tid='load-more-messages']"
