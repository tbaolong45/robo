[project]
name = "robo"
version = "0.1.0"
description = "Robo - a desktop robot-face study buddy whose brain is Hermes Agent."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pyside6>=6.8",
    "httpx>=0.28",
    "jeepney>=0.8; sys_platform == 'linux'",
    "pyobjc-framework-Quartz>=11; sys_platform == 'darwin'",
    "sounddevice>=0.5.6",
    "numpy>=2.4.6",
    "onnx-asr[cpu,hub]>=0.12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
]

[project.scripts]
robo = "robo.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/robo"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
