[project]
name = "robo-agent"
version = "0.3.0"
description = "Robo's chat service: streams DeepSeek replies to the Robo app."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic==1.17.0",
    "aiohttp==3.14.5",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "ruff==0.17.1",
]

[project.scripts]
robo-agent = "robo_agent.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent/robo_agent"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv]
exclude-newer = "2026-10-21T00:00:00Z"  # every locked package is at least two weeks old
