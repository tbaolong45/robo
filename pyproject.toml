[project]
name = "pli"
version = "0.1.0"
description = "Personal Learning Intelligence - gather course materials, track deadlines, plan the study week."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.32",
    "typer>=0.15",
    "rich>=13.9",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "playwright>=1.63.0",
    "typesafe-sdk>=0.7.2",
]

[project.optional-dependencies]
# Phase 4: text extraction, summarisation, local semantic search.
enrich = [
    "pypdf>=5.1",
    "python-pptx>=1.0",
    "python-docx>=1.1",
    "openpyxl>=3.1",
    "fastembed>=0.4",
    "numpy>=2.1",
]
# `pli agent --voice`: local speech-to-text. Also needs the system library
# PortAudio: `sudo apt install libportaudio2`.
voice = [
    "faster-whisper>=1.2",
    "sounddevice>=0.5",
]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
]

[project.scripts]
pli = "pli.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pli"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
# B008: typer's whole API is `x: T = typer.Option(...)` as a default - not a bug.
ignore = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
