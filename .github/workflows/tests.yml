name: tests
on:
  push:
    branches: [master]  # macOS minutes count 10x on a private repo
  pull_request:
    branches: [master]  # dev -> master: tested before the laptops get it
  workflow_dispatch:
jobs:
  swift:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      # Every suite runs, KeyboardTests.swift (EditKeyTests, KeyboardHandoffTests) included: they need a
      # key window, and a hosted macOS runner has a logged-in, unlocked GUI session. They fail on a locked
      # screen; if the runner turns out to be one, skip them: native/test.sh --skip 'EditKeyTests|KeyboardHandoffTests'
      # Report every compile error at once: this Xcode can reject expressions the newer local compiler accepts.
      - run: native/test.sh -Xswiftc -continue-building-after-errors
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v10.3.0
      - run: uv sync
      - run: uv run pytest -q
      - run: uv run ruff check agent tests
